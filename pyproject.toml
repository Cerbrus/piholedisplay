[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piholedisplay"
version = "2.0.0"
description = "Pi-hole statistics on a Waveshare 2.13 inch three-colour e-paper display"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pillow>=9.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["piholedisplay", "piholedisplay.lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["piholedisplay/lib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
